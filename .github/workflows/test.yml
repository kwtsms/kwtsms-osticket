name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint
        run: for f in *.php tests/*.php tests/stubs/*.php; do php -l "$f"; done
      - name: Unit tests
        run: php tests/run.php
      - name: Build zip
        run: sh build.sh
